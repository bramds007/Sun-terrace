<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SunTerras — Schaduwtapijt (2D projectie)</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
    header{padding:10px 12px;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    #map{position:absolute;inset:108px 0 0 0}
    .badge{padding:4px 8px;border-radius:999px;background:#f5f5f5}
    .btn{padding:6px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}
  </style>
</head>
<body>
<header>
  <strong>SunTerras</strong>
  <span class="badge" id="info">Laden…</span>
  <span class="badge" id="dataBadge">Terrassen: ? • Gebouwen: ?</span>
  <span class="badge" id="dbgBadge">shadow: —</span>

  <label>Tijd: <input id="time" type="time" step="300" /></label>
  <label>Datum: <input id="date" type="date" /></label>
  <button class="btn" id="btnNow">Nu</button>
  <label><input id="onlySunny" type="checkbox" /> alleen zon</label>
  <span class="badge" id="sunBadge">Zon: …</span>
</header>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
/* ===== Zonberekening (SunCalc-achtig) ===== */
function toRad(d){return d*Math.PI/180}
function toDeg(r){return r*180/Math.PI}
function getJulian(date){return date/86400000 - date.getTimezoneOffset()/1440 + 2440587.5}
function solarMeanAnomaly(d){return toRad(357.5291 + 0.98560028*(d-2451545))}
function eclipticLongitude(M){const C=toRad(1.9148)*Math.sin(M)+toRad(0.02)*Math.sin(2*M)+toRad(0.0003)*Math.sin(3*M);const P=toRad(102.9372);return M+C+P+Math.PI;}
function sunCoords(d){const M=solarMeanAnomaly(d),L=eclipticLongitude(M),e=toRad(23.4397);return{dec:Math.asin(Math.sin(e)*Math.sin(L)),ra:Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))};}
function siderealTime(d,lw){return toRad((280.16+360.9856235*(d-2451545)))-lw;}
function sunPosition(date, lat, lon){
  const lw=toRad(-lon), phi=toRad(lat), d=getJulian(date)-2451545, c=sunCoords(d);
  const H=siderealTime(getJulian(date),lw)-c.ra;
  const alt=Math.asin(Math.sin(phi)*Math.sin(c.dec)+Math.cos(phi)*Math.cos(c.dec)*Math.cos(H));
  const azSouth=Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(c.dec)*Math.cos(phi)); // 0°=Z
  const azSouthDeg=(toDeg(azSouth)+360)%360;
  const azNorthDeg=(azSouthDeg+180)%360; // Noordreferentie (voor bearings & Turf)
  return { altitude: toDeg(alt), azNorth: azNorthDeg };
}

/* ===== Instellingen ===== */
const AMS = { lon: 4.895168, lat: 52.370216 };
const ALT_MIN = 3.0;
const SHADE_THRESHOLD = 0.5;      // min. zonfractie voor “zon”
const MAX_BUILDINGS = 600;        // performance cap per viewport
const MAX_BUILDING_DIST_M = 180;  // alleen nabije gebouwen
const SIMPLIFY_TOL_M = 0.6;       // geometrie-simplificatie (meter)
const SHADOW_STYLE_OPACITY = 0.35;

const COLORS = { sunFill:'#22c55e', shadeFill:'#cbd5e1' };

let TERR_POLY=null, TERR_POLY_CURRENT=null;
let BUILDINGS={type:'FeatureCollection',features:[]};
let SHADOW_UNION=null; // GeoJSON polygon/multipolygon
</script>

<script>
/* ===== Kaart ===== */
const map = new maplibregl.Map({
  container: 'map',
  style: { version: 8,
    sources: { osm: { type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256, attribution:'© OpenStreetMap' } },
    layers: [{ id:'osm', type:'raster', source:'osm' }]
  },
  center: [AMS.lon, AMS.lat], zoom: 13
});
map.addControl(new maplibregl.NavigationControl());

map.on('load', init);

async function init(){
  const info=document.getElementById('info');
  const badge=document.getElementById('dataBadge');

  try{
    const r = await fetch('/api/terraces');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();

    TERR_POLY = data.terracePolys || { type:'FeatureCollection', features:[] };
    TERR_POLY_CURRENT = TERR_POLY;

    map.addSource('terr-polys', { type:'geojson', data:TERR_POLY_CURRENT, promoteId:'id' });
    map.addLayer({ id:'terr-fill', type:'fill', source:'terr-polys', paint:{ 'fill-color': COLORS.shadeFill, 'fill-opacity':0.55 }});
    map.addLayer({ id:'terr-outline', type:'line', source:'terr-polys', paint:{ 'line-color':'#111','line-width':1 }});
    map.addLayer({ id:'terr-label', type:'symbol', source:'terr-polys',
      layout:{ 'text-field':['get','name'], 'text-size':11, 'text-offset':[0,1.0], 'text-anchor':'top' },
      paint:{ 'text-halo-color':'#fff','text-halo-width':1.2 }});

    // Gebouwen + schaduwtapijt (visual)
    map.addSource('bldg', { type:'geojson', data: BUILDINGS });
    map.addLayer({ id:'bldg-outline', type:'line', source:'bldg',
      paint:{ 'line-color':'#9ca3af','line-width':0.6,'line-opacity':0.6 }});

    map.addSource('shadow', { type:'geojson', data: emptyFC() });
    map.addLayer({ id:'shadow-fill', type:'fill', source:'shadow',
      paint:{ 'fill-color':'#000','fill-opacity': SHADOW_STYLE_OPACITY }});

    map.on('click','terr-fill',(e)=>{
      const f=e.features[0];
      const p=f.properties||{};
      const st=map.getFeatureState({ source:'terr-polys', id:f.id })||{};
      const expl=st.explain?`<br><small>${st.explain}</small>`:'';
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<strong>${p.name||'Terras'}</strong><br>${st.sunny?'🌞 in de zon':'⛅︎ schaduw'}${expl}`)
        .addTo(map);
    });

    fitTo(TERR_POLY);
    info.textContent='OK';
    badge.textContent=`Terrassen: ${TERR_POLY.features.length} • Gebouwen: …`;

    setupSunControls();
    await loadBuildingsForViewport();
    await recomputeShadowsAndApply();  // eerste run

    let t; map.on('moveend', ()=>{
      clearTimeout(t);
      t=setTimeout(async ()=>{
        await loadBuildingsForViewport();
        await recomputeShadowsAndApply();
      },150);
    });

  }catch(e){
    info.textContent='Laden mislukt'; console.error(e);
  }
}

function fitTo(polys){
  const ex=[Infinity,Infinity,-Infinity,-Infinity];
  const bump=([x,y])=>{ if(x<ex[0])ex[0]=x; if(y<ex[1])ex[1]=y; if(x>ex[2])ex[2]=x; if(y>ex[3])ex[3]=y; };
  (polys.features||[]).forEach(f=>{
    const rings = f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    rings.forEach(poly=>poly[0].forEach(bump));
  });
  if (isFinite(ex[0])) map.fitBounds([[ex[0],ex[1]],[ex[2],ex[3]]],{padding:60,duration:600});
}

/* ===== Gebouwen laden ===== */
function currentBbox(){ const b=map.getBounds(); return [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(','); }
async function loadBuildingsForViewport(){
  const bbox=currentBbox();
  const r=await fetch(`/api/buildings?bbox=${bbox}`);
  const j=await r.json().catch(()=>null);
  BUILDINGS=j?.buildings || { type:'FeatureCollection',features:[] };

  // Filter & sorteer op nabijheid (cap voor performance)
  const c = map.getCenter().toArray();
  BUILDINGS.features = (BUILDINGS.features||[])
    .filter(f => typeof f.properties?.h_m==='number' && f.properties.h_m>=3)
    .map(f => ({ f, d: turf.distance(c, turf.center(f).geometry.coordinates) }))
    .sort((a,b)=>a.d-b.d)
    .slice(0, MAX_BUILDINGS)
    .map(x=>x.f);

  // Simplify (meter → km)
  if (SIMPLIFY_TOL_M > 0) {
    const tol = SIMPLIFY_TOL_M/1000;
    BUILDINGS.features = BUILDINGS.features.map(f=>{
      try{ return turf.simplify(f, {tolerance: tol, highQuality:false, mutate:false}); }
      catch{ return f; }
    });
  }

  if(map.getSource('bldg')) map.getSource('bldg').setData(BUILDINGS);
  const badge=document.getElementById('dataBadge');
  if(badge) badge.textContent=`Terrassen: ${TERR_POLY.features.length} • Gebouwen: ${BUILDINGS.features.length}`;
}

/* ===== Zon UI ===== */
function setupSunControls(){
  const t=document.getElementById('time');
  const d=document.getElementById('date');
  const btnNow=document.getElementById('btnNow');
  const only=document.getElementById('onlySunny');

  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  if(t) t.value=`${pad(now.getHours())}:${pad(now.getMinutes()-now.getMinutes()%5)}`;
  if(d) d.valueAsDate=new Date(now.getFullYear(), now.getMonth(), now.getDate());

  const onChange=()=>recomputeShadowsAndApply();
  t.addEventListener('input',onChange);
  d.addEventListener('input',onChange);
  only.addEventListener('change',onChange);
  btnNow.addEventListener('click',()=>{
    const n=new Date();
    t.value=`${pad(n.getHours())}:${pad(n.getMinutes()-n.getMinutes()%5)}`;
    d.valueAsDate=new Date(n.getFullYear(), n.getMonth(), n.getDate());
    recomputeShadowsAndApply();
  });
}

/* ===== Kern: schaduwtapijt + per-terras zon ===== */
async function recomputeShadowsAndApply(){
  const t=document.getElementById('time');
  const d=document.getElementById('date');
  const b=document.getElementById('sunBadge');
  const only=document.getElementById('onlySunny');
  const dbg=document.getElementById('dbgBadge');

  const base=d.valueAsDate || new Date();
  const [hh,mm]=(t.value||'12:00').split(':').map(x=>parseInt(x,10));
  const when=new Date(base.getFullYear(), base.getMonth(), base.getDate(), hh||12, mm||0);

  const sp=sunPosition(when, AMS.lat, AMS.lon);
  const alt=sp.altitude;
  const azNorth=sp.azNorth;
  b.textContent=`Zon: alt ${alt.toFixed(1)}° • az ${Math.round(azNorth)}° ${alt>ALT_MIN?'🌞':''}`;

  // Te lage zon -> alles schaduw (tapijt leeg houden voor duidelijkheid)
  if (alt <= ALT_MIN || BUILDINGS.features.length === 0) {
    SHADOW_UNION = emptyFC();
    updateShadowLayer(SHADOW_UNION);
    applySunOnTerraces(null, alt, only.checked);
    dbg.textContent = `shadow: off (alt≤${ALT_MIN}° of 0 gebouwen)`;
    return;
  }

  // 1) maak schaduwen per gebouw
  const Lfactor = 1/Math.tan(Math.max(alt*Math.PI/180, 0.01)); // L = h * Lfactor
  const shadowDir = (azNorth + 180) % 360;

  const center = map.getCenter().toArray();
  const shadows = [];
  for (const b of BUILDINGS.features) {
    const h = b.properties?.h_m || 0;
    if (h < 3) continue;

    // afstandsfilter (centroid)
    const dMeters = turf.distance(center, turf.center(b).geometry.coordinates) * 1000;
    if (dMeters > MAX_BUILDING_DIST_M) continue;

    const L = h * Lfactor; // meters
    if (L <= 0.1) continue;

    const sw = sweepShadow(b, L, shadowDir); // quad-vegen + topcap
    if (sw) shadows.push(sw);
  }

  // 2) union (in batches om te voorkomen dat turf.union verstikt)
  SHADOW_UNION = unionBatch(shadows, 40);
  updateShadowLayer(SHADOW_UNION);

  // 3) per terras zonfractie
  applySunOnTerraces(SHADOW_UNION, alt, only.checked);

  dbg.textContent = `shadow: buildings=${BUILDINGS.features.length} polys=${shadows.length}`;
}

/* schaduw van één gebouw: veeg elk buiten-segment over vector v en maak quads */
function sweepShadow(bldg, L_m, bearingDeg){
  try{
    const rings = bldg.geometry.type==='Polygon' ? [bldg.geometry.coordinates]
                  : (bldg.geometry.type==='MultiPolygon' ? bldg.geometry.coordinates : null);
    if (!rings) return null;

    const vkm = L_m/1000;
    const quads = [];

    for (const poly of rings) {
      const outer = poly[0];
      for (let i=0;i<outer.length-1;i++){
        const p0 = outer[i], p1 = outer[i+1];
        const p0t = turf.transformTranslate(turf.point(p0), vkm, bearingDeg, {units:'kilometers'}).geometry.coordinates;
        const p1t = turf.transformTranslate(turf.point(p1), vkm, bearingDeg, {units:'kilometers'}).geometry.coordinates;
        const quad = turf.polygon([ [p0,p1,p1t,p0t,p0] ]);
        quads.push(quad);
      }
      // “top cap”: de footprint vertaald vormt de bovenzijde van de schaduw
      const cap = turf.transformTranslate(turf.polygon([outer]), vkm, bearingDeg, {units:'kilometers'});
      quads.push(cap);
    }

    return unionBatch(quads, 60);
  }catch{ return null; }
}

/* union in batches om performance te beschermen */
function unionBatch(polys, batch=50){
  if (!polys || polys.length===0) return emptyFC();
  let acc = polys[0];
  for (let i=1;i<polys.length;i++){
    try{
      acc = turf.union(acc, polys[i]);
      if ((i % batch)===0) acc = turf.simplify(acc, {tolerance: 0.00001, highQuality:false});
    }catch(e){
      // fallback: sla deze over
    }
  }
  return acc || emptyFC();
}

function updateShadowLayer(gj){ const src=map.getSource('shadow'); if(src) src.setData(gj||emptyFC()); }

/* kleur & filter terrassen o.b.v. zonfractie */
function applySunOnTerraces(shadowFC, alt, onlySunny){
  const src = map.getSource('terr-polys');
  if (!src) return;

  const sunnySet = [];
  for (const f of (TERR_POLY.features||[])){
    const A = Math.max(turf.area(f), 0.01);
    let sunFrac = 1;
    if (shadowFC && shadowFC.type){
      try{
        const inter = turf.intersect(f, shadowFC);
        const Ash = inter ? turf.area(inter) : 0;
        sunFrac = Math.max(0, 1 - (Ash/A));
      }catch{ sunFrac = 1; }
    }
    const sunny = (alt > ALT_MIN) && (sunFrac >= SHADE_THRESHOLD);
    map.setFeatureState({ source:'terr-polys', id:f.id }, { sunny, explain:`zonfractie ~ ${(sunFrac*100)|0}%` });
    if (sunny) sunnySet.push(f);
  }

  // verven via feature-state
  map.setPaintProperty('terr-fill','fill-color',
    ['case',['boolean',['feature-state','sunny'],false], COLORS.sunFill, COLORS.shadeFill]);

  // subset voor “alleen zon”
  if (onlySunny) {
    src.setData({ type:'FeatureCollection', features: sunnySet });
  } else {
    src.setData(TERR_POLY);
  }
}

/* helpers */
function emptyFC(){ return { type:'FeatureCollection', features:[] }; }
</script>
</body>
</html>
