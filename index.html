<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SunTerras — Globale zon + gebouwen debug</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
    header{padding:10px 12px;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    #map{position:absolute;inset:64px 0 0 0}
    .badge{padding:4px 8px;border-radius:999px;background:#f5f5f5}
    .btn{padding:6px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}
  </style>
</head>
<body>
<header>
  <strong>SunTerras</strong>
  <span class="badge" id="info">Laden…</span>
  <span class="badge" id="dataBadge">Terrassen: ? • Gebouwen: ?</span>

  <label>Tijd: <input id="time" type="time" step="300" /></label>
  <label>Datum: <input id="date" type="date" /></label>
  <button class="btn" id="btnNow">Nu</button>
  <span class="badge" id="sunBadge">Zon: …</span>
</header>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
/* ===== Zonberekening ===== */
function toRad(d){return d*Math.PI/180}
function toDeg(r){return r*180/Math.PI}
function getJulian(date){return date/86400000 - date.getTimezoneOffset()/1440 + 2440587.5}
function solarMeanAnomaly(d){return toRad(357.5291 + 0.98560028*(d-2451545))}
function eclipticLongitude(M){const C=toRad(1.9148)*Math.sin(M)+toRad(0.02)*Math.sin(2*M)+toRad(0.0003)*Math.sin(3*M);const P=toRad(102.9372);return M+C+P+Math.PI;}
function sunCoords(d){const M=solarMeanAnomaly(d),L=eclipticLongitude(M),e=toRad(23.4397);return{dec:Math.asin(Math.sin(e)*Math.sin(L)),ra:Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))};}
function siderealTime(d,lw){return toRad((280.16+360.9856235*(d-2451545)))-lw;}
function sunPosition(date, lat, lon){
  const lw=toRad(-lon), phi=toRad(lat), d=getJulian(date)-2451545, c=sunCoords(d);
  const H=siderealTime(getJulian(date),lw)-c.ra;
  const alt=Math.asin(Math.sin(phi)*Math.sin(c.dec)+Math.cos(phi)*Math.cos(c.dec)*Math.cos(H));
  const az=Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(c.dec)*Math.cos(phi));
  return { altitude: toDeg(alt), azimuth: (toDeg(az)+180+360)%360 };
}

/* ===== App state ===== */
const AMS = { lon: 4.895168, lat: 52.370216 };
const ALT_THRESHOLD = 2.5;
const COLORS = { sunFill:'#22c55e', shadeFill:'#cbd5e1' };

let TERR_POLY = null;
let BUILDINGS = { type:'FeatureCollection', features:[] };
</script>

<script>
/* ===== Kaart ===== */
const map = new maplibregl.Map({
  container: 'map',
  style: { version: 8,
    sources: { osm: { type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256, attribution:'© OpenStreetMap' } },
    layers: [{ id:'osm', type:'raster', source:'osm' }]
  },
  center: [AMS.lon, AMS.lat], zoom: 13
});
map.addControl(new maplibregl.NavigationControl());

map.on('load', init);

async function init(){
  const info=document.getElementById('info');
  const badge=document.getElementById('dataBadge');

  try {
    const r = await fetch('/api/terraces');
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();

    TERR_POLY = data.terracePolys || { type:'FeatureCollection', features:[] };

    map.addSource('terr-polys', { type:'geojson', data: TERR_POLY });
    map.addLayer({ id:'terr-fill', type:'fill', source:'terr-polys',
      paint:{ 'fill-color': COLORS.shadeFill, 'fill-opacity':0.55 }});
    map.addLayer({ id:'terr-outline', type:'line', source:'terr-polys',
      paint:{ 'line-color':'#111','line-width':1 }});
    map.addLayer({ id:'terr-label', type:'symbol', source:'terr-polys',
      layout:{ 'text-field':['get','name'], 'text-size':11, 'text-offset':[0,1.0], 'text-anchor':'top' },
      paint:{ 'text-halo-color':'#fff', 'text-halo-width':1.2 }});

    // Gebouwen bron + lagen (outline)
    map.addSource('bldg', { type:'geojson', data: BUILDINGS });
    map.addLayer({ id:'bldg-outline', type:'line', source:'bldg',
      paint:{ 'line-color':'#9ca3af','line-width':0.8,'line-opacity':0.8 }});

    // popup
    map.on('click','terr-fill', (e) => {
      const p = e.features[0].properties || {};
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<strong>${p.name || 'Terras'}</strong>`)
        .addTo(map);
    });

    fitTo(TERR_POLY);
    info.textContent = 'OK';
    badge.textContent = `Terrassen: ${TERR_POLY.features.length} • Gebouwen: …`;

    // Zon UI
    setupSunControls();
    updateSunStyle();

    // eerste gebouwenload + elke moveend (debounced)
    await loadBuildingsForViewport();
    let t; map.on('moveend', ()=>{ clearTimeout(t); t=setTimeout(loadBuildingsForViewport, 150); });

  } catch (e) {
    info.textContent = 'Laden mislukt';
    console.error(e);
  }
}

function fitTo(polys){
  const ex=[Infinity,Infinity,-Infinity,-Infinity];
  const bump=([x,y])=>{ if(x<ex[0])ex[0]=x; if(y<ex[1])ex[1]=y; if(x>ex[2])ex[2]=x; if(y>ex[3])ex[3]=y; };
  (polys.features||[]).forEach(f=>{
    const rings = f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    rings.forEach(poly=>poly[0].forEach(bump));
  });
  if (isFinite(ex[0])) map.fitBounds([[ex[0],ex[1]],[ex[2],ex[3]]], { padding:60, duration:600 });
}

/* ===== Gebouwen laden + badge updaten ===== */
function currentBbox(){
  const b = map.getBounds();
  return [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
}
async function loadBuildingsForViewport(){
  const bbox = currentBbox();
  const r = await fetch(`/api/buildings?bbox=${bbox}`);
  const j = await r.json().catch(()=>null);
  BUILDINGS = j?.buildings || { type:'FeatureCollection', features:[] };
  // update bron
  if (map.getSource('bldg')) map.getSource('bldg').setData(BUILDINGS);
  const badge=document.getElementById('dataBadge');
  if (badge) badge.textContent = `Terrassen: ${TERR_POLY.features.length} • Gebouwen: ${BUILDINGS.features.length} (OSM)`;
}

/* ===== Zon UI & globale kleuring (ongewijzigd) ===== */
function setupSunControls(){
  const t=document.getElementById('time');
  const d=document.getElementById('date');
  const btnNow=document.getElementById('btnNow');

  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  if (t) t.value = `${pad(now.getHours())}:${pad(now.getMinutes()-now.getMinutes()%5)}`;
  if (d) d.valueAsDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  t.addEventListener('input', updateSunStyle);
  d.addEventListener('input', updateSunStyle);
  btnNow.addEventListener('click', ()=>{
    const n=new Date();
    t.value = `${pad(n.getHours())}:${pad(n.getMinutes()-n.getMinutes()%5)}`;
    d.valueAsDate = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    updateSunStyle();
  });
}

function updateSunStyle(){
  const t=document.getElementById('time');
  const d=document.getElementById('date');
  const b=document.getElementById('sunBadge');

  const base = d.valueAsDate || new Date();
  const [hh,mm] = (t.value||'12:00').split(':').map(x=>parseInt(x,10));
  const when = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hh||12, mm||0);

  const sp = sunPosition(when, AMS.lat, AMS.lon);
  const isSunny = sp.altitude > ALT_THRESHOLD;
  b.textContent = `Zon: alt ${sp.altitude.toFixed(1)}° • az ${Math.round(sp.azimuth)}° ${isSunny?'🌞':''}`;

  map.setPaintProperty('terr-fill','fill-color', isSunny ? COLORS.sunFill : COLORS.shadeFill);
}
</script>
</body>
</html>
